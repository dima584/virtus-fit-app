<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-white p-4">
    <h1 class="text-xl font-bold mb-4">Прогрес: <span id="user-name">...</span></h1>
    
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-[#2d2d2d] p-4 rounded-xl text-center">
            <p class="opacity-60 text-sm">Вага</p>
            <p class="text-2xl font-bold text-blue-400" id="user-weight">0 кг</p>
        </div>
        <div class="bg-[#2d2d2d] p-4 rounded-xl text-center">
            <p class="opacity-60 text-sm">Спроби ІІ</p>
            <p class="text-2xl font-bold text-green-400" id="user-balance">0</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Твої дані з бота
        const SUPABASE_URL = "https://ckokeseagvvghxpmulwp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Ir8nKEcq4o3ap05_4MIaPg_ZtJGPG1Z";
        const supabase = document.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadUserData() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-name').innerText = user.first_name;
                
                // Отримуємо дані з Supabase за Telegram ID
                const { data, error } = await supabase
                    .from('users')
                    .select('weight, balance')
                    .eq('user_id', user.id)
                    .single();

                if (data) {
                    document.getElementById('user-weight').innerText = data.weight + " кг";
                    document.getElementById('user-balance').innerText = data.balance;
                }
            }
        }
        loadUserData();
    </script>
</body>
</html>
