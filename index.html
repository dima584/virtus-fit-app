<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtus Fit AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #1a1a1a); color: var(--tg-theme-text-color, #ffffff); }
        .card { background-color: var(--tg-theme-secondary-bg-color, #2d2d2d); border-radius: 20px; }
        .accent-text { color: var(--tg-theme-button-color, #3390ec); }
        .btn-main { background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #ffffff); }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; padding: 5px; width: 65px; text-align: center; font-size: 14px; }
        .progress-ring { transition: stroke-dashoffset 0.5s ease; }
        .food-item { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .food-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="p-4 font-sans select-none">
    <div class="flex justify-between items-start mb-6">
        <div>
            <h1 class="text-2xl font-bold italic">Привіт, <span id="user-name" class="accent-text">...</span>! 👋</h1>
            <p class="text-[10px] opacity-50 uppercase tracking-widest" id="status-msg">Синхронізація...</p>
        </div>
        <div class="card p-3 text-center min-w-[80px]">
            <span class="text-[9px] opacity-50 uppercase font-bold tracking-tighter">Баланс ІІ</span>
            <div class="text-lg font-black accent-text" id="user-balance">--</div>
        </div>
    </div>

    <div class="card p-5 mb-4 border border-white/5 shadow-lg">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest">Денна норма</h3>
            <span class="text-[10px] accent-text font-bold" id="cal-percent">0%</span>
        </div>
        <div class="flex justify-around items-center">
            <div class="relative flex items-center justify-center">
                <svg class="w-20 h-20 transform -rotate-90">
                    <circle cx="40" cy="40" r="35" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="none"/>
                    <circle id="cal-circle" cx="40" cy="40" r="35" stroke="#3390ec" stroke-width="8" fill="none" 
                            stroke-dasharray="220" stroke-dashoffset="220" stroke-linecap="round" class="progress-ring"/>
                </svg>
                <div class="absolute text-center transform rotate-90">
                    <span class="text-sm font-black" id="total-cal">0</span>
                    <p class="text-[8px] opacity-40 uppercase">ккал</p>
                </div>
            </div>
            <div class="flex-1 ml-6 space-y-2">
                <div>
                    <div class="flex justify-between text-[9px] mb-1"><span class="opacity-50 text-orange-400">Білки</span><span id="p-val">0г</span></div>
                    <div class="w-full bg-white/5 h-1 rounded-full"><div id="p-bar" class="bg-orange-400 h-full rounded-full" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[9px] mb-1"><span class="opacity-50 text-yellow-400">Жири</span><span id="f-val">0г</span></div>
                    <div class="w-full bg-white/5 h-1 rounded-full"><div id="f-bar" class="bg-yellow-400 h-full rounded-full" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[9px] mb-1"><span class="opacity-50 text-green-400">Вугл.</span><span id="c-val">0г</span></div>
                    <div class="w-full bg-white/5 h-1 rounded-full"><div id="c-bar" class="bg-green-400 h-full rounded-full" style="width: 0%"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-3 mb-6">
        <div class="card p-4 flex justify-between items-center border border-white/5">
            <div><span class="text-[10px] opacity-50 uppercase font-bold">Вага зараз</span><div class="text-2xl font-black" id="weight-display">-- кг</div></div>
            <div class="flex gap-2"><input type="number" id="weight-input" step="0.1" placeholder="00.0"><button onclick="updateField('weight')" class="btn-main px-4 py-2 rounded-xl text-xs font-bold uppercase">ОК</button></div>
        </div>
    </div>

    <div class="card p-5 mb-4 border border-white/5 shadow-2xl">
        <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest mb-4">Аналітика ваги</h3>
        <div style="height: 140px;"><canvas id="weightChart"></canvas></div>
    </div>

    <div class="card p-5 mb-6 border border-white/5 shadow-lg">
        <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest mb-4">Архів їжі за сьогодні</h3>
        <div id="food-list" class="space-y-3">
            <p class="text-[10px] opacity-30 italic text-center py-2">Сьогодні записів ще немає...</p>
        </div>
    </div>

    <button onclick="tg.close()" class="w-full btn-main py-4 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-transform mb-6">Закрити</button>

    <script>
        const tg = window.Telegram.WebApp;
        const SUPABASE_URL = "https://ckokeseagvvghxpmulwp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Ir8nKEcq4o3ap05_4MIaPg_ZtJGPG1Z";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUserId = null, chartInstance = null;

        async function initApp() {
            tg.ready(); tg.expand();
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = urlParams.get('user_id') || tg.initDataUnsafe?.user?.id;
            if (!currentUserId) return;
            await loadData(); await loadNutrition(); await loadChart();
        }

        async function loadData() {
            const { data } = await supabaseClient.from('users').select('*').eq('user_id', currentUserId).maybeSingle();
            if (data) {
                document.getElementById('user-name').innerText = data.name || "Атлет";
                document.getElementById('weight-display').innerText = data.weight + " кг";
                document.getElementById('user-balance').innerText = data.balance ?? "0";
                document.getElementById('status-msg').innerText = "Оновлено";
            }
        }

        async function loadNutrition() {
            const today = new Date().toLocaleDateString('sv'); // Формат YYYY-MM-DD
            const { data } = await supabaseClient.from('nutrition_logs')
                .select('*')
                .eq('user_id', currentUserId)
                .gte('created_at', today)
                .order('created_at', { ascending: false });

            if (data) {
                const totals = data.reduce((acc, curr) => ({
                    cal: acc.cal + (curr.calories || 0),
                    p: acc.p + (curr.proteins || 0),
                    f: acc.f + (curr.fats || 0),
                    c: acc.c + (curr.carbs || 0)
                }), { cal: 0, p: 0, f: 0, c: 0 });

                document.getElementById('total-cal').innerText = totals.cal;
                document.getElementById('p-val').innerText = totals.p + 'г';
                document.getElementById('f-val').innerText = totals.f + 'г';
                document.getElementById('c-val').innerText = totals.c + 'г';

                const calTarget = 2000;
                const percent = Math.min((totals.cal / calTarget) * 100, 100);
                document.getElementById('cal-percent').innerText = Math.round(percent) + '%';
                document.getElementById('cal-circle').style.strokeDashoffset = 220 - (220 * percent / 100);
                
                document.getElementById('p-bar').style.width = Math.min((totals.p / 100) * 100, 100) + '%';
                document.getElementById('f-bar').style.width = Math.min((totals.f / 70) * 100, 100) + '%';
                document.getElementById('c-bar').style.width = Math.min((totals.c / 250) * 100, 100) + '%';

                // ОНОВЛЕННЯ СПИСКУ СТРАВ
                const listContainer = document.getElementById('food-list');
                if (data.length > 0) {
                    listContainer.innerHTML = data.map(item => `
                        <div class="food-item pb-2 flex justify-between items-center">
                            <div>
                                <div class="text-xs font-bold">${item.food_name || 'Страва'}</div>
                                <div class="text-[9px] opacity-40 italic">Б:${item.proteins} Ж:${item.fats} В:${item.carbs}</div>
                            </div>
                            <div class="accent-text font-black text-xs">${item.calories} ккал</div>
                        </div>
                    `).join('');
                }
            }
        }

        async function loadChart() {
            const { data } = await supabaseClient.from('weight_history').select('weight, created_at').eq('user_id', currentUserId).order('created_at', { ascending: true }).limit(7);
            if (data && data.length > 0) {
                const labels = data.map(i => new Date(i.created_at).toLocaleDateString('uk', {day:'numeric', month:'short'}));
                const weights = data.map(i => i.weight);
                const minW = Math.min(...weights) - 1.5, maxW = Math.max(...weights) + 1.5;
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(document.getElementById('weightChart'), {
                    type: 'line', plugins: [ChartDataLabels],
                    data: { labels, datasets: [{ data: weights, borderColor: '#3390ec', backgroundColor: 'rgba(51, 144, 236, 0.1)', borderWidth: 3, tension: 0.4, fill: true, pointRadius: 5, pointBackgroundColor: '#3390ec', datalabels: { align: 'top', color: '#fff', font: { weight: 'bold' }, formatter: v => v+'кг' }}] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: minW, max: maxW, display: false }, x: { ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 9 } }, grid: { display: false } } } }
                });
            }
        }

        async function updateField(field) {
            const val = document.getElementById('weight-input').value;
            if (!val) return;
            const { error } = await supabaseClient.from('users').update({[field]: val}).eq('user_id', currentUserId);
            if (!error) { document.getElementById('weight-input').value = ''; await loadData(); await loadChart(); tg.HapticFeedback.notificationOccurred('success'); }
        }
        initApp();
    </script>
</body>
</html>
