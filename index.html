<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtus Fit App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a1a1a] text-white p-4 font-sans">
    <div class="mb-6">
        <h1 class="text-xl font-bold">Привіт, <span id="user-name" class="text-blue-400">...</span>! 👋</h1>
        <p class="text-xs opacity-50" id="status-msg">Завантаження даних...</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="bg-[#2d2d2d] p-4 rounded-2xl text-center shadow-lg">
            <p class="text-xs opacity-60 uppercase mb-1">Вага</p>
            <p class="text-3xl font-black text-blue-400" id="user-weight">--</p>
            <p class="text-[10px] opacity-40 mt-1">кг</p>
        </div>
        <div class="bg-[#2d2d2d] p-4 rounded-2xl text-center shadow-lg">
            <p class="text-xs opacity-60 uppercase mb-1">Баланс ІІ</p>
            <p class="text-3xl font-black text-green-400" id="user-balance">--</p>
            <p class="text-[10px] opacity-40 mt-1">запитів</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Твої ключі з коду бота
        const SUPABASE_URL = "https://ckokeseagvvghxpmulwp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Ir8nKEcq4o3ap05_4MIaPg_ZtJGPG1Z";
        
        // ПРАВИЛЬНА ініціалізація (через об'єкт supabase)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initApp() {
            const user = tg.initDataUnsafe?.user;
            
            if (!user) {
                document.getElementById('status-msg').innerText = "Помилка: Відкрий через Telegram";
                return;
            }

            document.getElementById('user-name').innerText = user.first_name;

            try {
                // Робимо запит до таблиці users
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('weight, balance')
                    .eq('user_id', user.id)
                    .single();

                if (error) throw error;

                if (data) {
                    // Виводимо 70 кг та 93 запити
                    document.getElementById('user-weight').innerText = data.weight || "0";
                    document.getElementById('user-balance').innerText = data.balance || "0";
                    document.getElementById('status-msg').innerText = "Дані оновлено";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-msg').innerText = "Помилка БД: " + err.message;
                document.getElementById('status-msg').className = "text-xs text-red-400";
            }
        }

        initApp();
    </script>
</body>
</html>
