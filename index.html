<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtus Fit Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #1a1a1a); color: var(--tg-theme-text-color, #ffffff); }
        .card { background-color: var(--tg-theme-secondary-bg-color, #2d2d2d); border-radius: 20px; transition: all 0.3s ease; }
        .accent-text { color: var(--tg-theme-button-color, #3390ec); }
        .btn-main { background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #ffffff); }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; padding: 5px; width: 80px; text-align: center; }
    </style>
</head>
<body class="p-4 font-sans select-none">
    <div class="flex justify-between items-start mb-6">
        <div>
            <h1 class="text-2xl font-bold">Привіт, <span id="user-name" class="accent-text">Атлет</span>!</h1>
            <p class="text-[10px] opacity-50 mt-1 uppercase tracking-tighter" id="status-msg">Синхронізація...</p>
        </div>
        <div class="card p-3 text-center min-w-[80px]">
            <span class="text-[9px] opacity-50 uppercase font-bold">Баланс</span>
            <div class="text-lg font-black accent-text" id="user-balance">--</div>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-3 mb-6">
        <div class="card p-4 flex justify-between items-center border border-white/5">
            <div class="flex flex-col">
                <span class="text-[10px] opacity-50 uppercase font-bold">Поточна вага</span>
                <div class="text-2xl font-black" id="weight-display">-- кг</div>
            </div>
            <div class="flex gap-2">
                <input type="number" id="weight-input" placeholder="00.0">
                <button onclick="updateUserField('weight')" class="btn-main px-3 py-1 rounded-lg text-xs font-bold uppercase">ОК</button>
            </div>
        </div>

        <div class="card p-4 flex justify-between items-center border border-white/5">
            <div class="flex flex-col flex-1 mr-4">
                <span class="text-[10px] opacity-50 uppercase font-bold">Твоя ціль</span>
                <div class="text-sm font-medium leading-tight mt-1" id="goal-display">...</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="goal-input" placeholder="Напр: 65кг" style="width: 100px;">
                <button onclick="updateUserField('goal')" class="btn-main px-3 py-1 rounded-lg text-xs font-bold uppercase">ОК</button>
            </div>
        </div>
    </div>

    <div class="card p-5 mb-6 border border-white/5 text-center">
        <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest mb-4 text-left">Графік за тиждень</h3>
        <div class="h-16 w-full flex items-end justify-between px-2 gap-2">
            <div class="bg-blue-500/20 w-full h-[40%] rounded-t-md"></div>
            <div class="bg-blue-500/30 w-full h-[60%] rounded-t-md"></div>
            <div class="bg-blue-500/40 w-full h-[55%] rounded-t-md"></div>
            <div class="bg-blue-500/60 w-full h-[80%] rounded-t-md shadow-[0_0_10px_rgba(51,144,236,0.2)]"></div>
        </div>
    </div>

    <button onclick="window.Telegram.WebApp.close()" class="w-full btn-main py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg">Закрити</button>

    <script>
        const tg = window.Telegram.WebApp;
        const SUPABASE_URL = "https://ckokeseagvvghxpmulwp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Ir8nKEcq4o3ap05_4MIaPg_ZtJGPG1Z";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;

        async function initApp() {
            tg.ready();
            tg.expand();
            
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = urlParams.get('user_id') || tg.initDataUnsafe?.user?.id;

            if (!currentUserId) {
                document.getElementById('status-msg').innerText = "Помилка ID";
                return;
            }

            loadData();
        }

        async function loadData() {
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('user_id', currentUserId)
                .maybeSingle();

            if (data) {
                document.getElementById('user-name').innerText = data.name || "Атлет";
                document.getElementById('weight-display').innerText = (data.weight || "0") + " кг";
                document.getElementById('user-balance').innerText = data.balance ?? "0";
                document.getElementById('goal-display').innerText = data.goal || "Вкажи свою ціль";
                document.getElementById('status-msg').innerText = "Дані оновлено";
                document.getElementById('status-msg').style.color = "#4ade80";
            }
        }

        async function updateUserField(field) {
            const inputId = field === 'weight' ? 'weight-input' : 'goal-input';
            const value = document.getElementById(inputId).value;

            if (!value) return;

            document.getElementById('status-msg').innerText = "Зберігаю...";
            
            const updateData = {};
            updateData[field] = value;

            const { error } = await supabaseClient
                .from('users')
                .update(updateData)
                .eq('user_id', currentUserId);

            if (error) {
                alert("Помилка: " + error.message);
            } else {
                document.getElementById(inputId).value = '';
                loadData(); // Перезавантажуємо дані, щоб побачити зміни
                tg.HapticFeedback.notificationOccurred('success'); // Вібрація при успіху
            }
        }

        initApp();
    </script>
</body>
</html>
